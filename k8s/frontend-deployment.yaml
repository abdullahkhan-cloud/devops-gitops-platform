apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: devops-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: abdullahkhancloud/devops-gitops-frontend:v1
        imagePullPolicy: Always
        ports:
        - containerPort: 80