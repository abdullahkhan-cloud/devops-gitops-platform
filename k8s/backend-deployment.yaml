apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: devops-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: abdullahkhancloud/devops-gitops-backend:v1
        imagePullPolicy: Always
        ports:
        - containerPort: 8080